<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://0.peerjs.com wss://0.peerjs.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>QR Chat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg1:#0f0c29;--bg2:#302b63;--bg3:#24243e;--gl:rgba(255,255,255,.08);--bd:rgba(255,255,255,.16);--tx:#f2f2ff;--mut:#b4b4d6;--ac:#7c5cff;--ac2:#00d4ff;--ok:#2ee6a6}
@media(prefers-color-scheme:light){:root{--bg1:#e8eaff;--bg2:#d6ccff;--bg3:#c9f0ff;--gl:rgba(255,255,255,.55);--bd:rgba(120,120,160,.3);--tx:#1b1b3a;--mut:#55557a}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));background-attachment:fixed;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{height:100dvh;max-width:1100px;margin:auto;display:grid;grid-template-columns:330px 1fr;gap:12px;padding:12px}
.gl{background:var(--gl);border:1px solid var(--bd);border-radius:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 32px rgba(0,0,0,.25);min-height:0}
aside,main{display:flex;flex-direction:column;overflow:hidden}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bd)}
.hd b{display:block}.mut{color:var(--mut);font-size:.8rem}
.bdg{font-size:.7rem;color:var(--mut)}.bdg.on{color:var(--ok)}
button,input,textarea{font:inherit;color:var(--tx)}
button{border:0;border-radius:10px;padding:8px 12px;cursor:pointer;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font-weight:600}
button.s{background:var(--gl);border:1px solid var(--bd);color:var(--tx)}
input,textarea{width:100%;background:var(--gl);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;outline:none;resize:none}
#list{overflow-y:auto;flex:1}
.ci{display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--bd)}
.ci:hover,.ci.act{background:var(--gl)}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;position:relative}
.av i{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#8888a8;border:2px solid var(--bg2)}
.av i.on{background:var(--ok)}
.ci .t{flex:1;min-width:0}.ci .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .t .mut{font-size:.78rem}
.un{background:var(--ok);color:#042;border-radius:99px;font-size:.72rem;font-weight:700;padding:2px 8px}
#appr div{padding:10px 14px;background:rgba(255,200,0,.15);border-bottom:1px solid var(--bd);display:flex;gap:6px;align-items:center;font-size:.85rem}
#appr span{flex:1}
#empty{margin:auto;text-align:center;color:var(--mut);padding:20px}
#cv{display:flex;flex-direction:column;flex:1;min-height:0}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.b{max-width:80%;align-self:flex-start;padding:8px 12px;border-radius:14px;background:var(--gl);border:1px solid var(--bd);word-break:break-word}
.b.me{align-self:flex-end;background:linear-gradient(90deg,rgba(124,92,255,.55),rgba(0,212,255,.4))}
.b .who{font-size:.75rem;font-weight:700;color:var(--ac2)}
.b .tx{white-space:pre-wrap}.b .tm{font-size:.68rem;color:var(--mut);text-align:right;margin-top:2px}
.b img{max-width:100%;max-height:260px;border-radius:10px;display:block;margin-bottom:6px}
.b .dl{margin-top:6px;padding:5px 10px;font-size:.8rem}
#xf{font-size:.78rem;color:var(--mut);padding:0 14px}
.cm{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--bd);align-items:flex-end}
.hide{display:none!important}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:9;padding:16px}
.ov>div{width:min(380px,100%);padding:18px;display:grid;gap:10px;background:var(--bg2);text-align:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:99px;z-index:20;font-size:.85rem}
#back{display:none}
.hd button{padding:6px 9px}
.ac{padding:1px 7px;font-size:.7rem;margin-left:4px}
#jrow{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--bd)}
#jrow input{padding:7px 10px}
#mlist label{display:flex;gap:8px;padding:6px 2px}
#mlist input{width:auto}
@media(max-width:720px){#app{grid-template-columns:1fr;padding:0;gap:0}.gl{border-radius:0}main{display:none}#app.open aside{display:none}#app.open main{display:flex}#back{display:inline-block}}
</style>
</head>
<body>
<div id="app">
 <aside class="gl">
  <div class="hd"><div><b id="me"></b> <span class="bdg" id="st">…</span><br><span class="bdg" id="ld"></span> <button class="s ac hide" id="bLdr">👑 Leader banna hai</button></div><div><button class="s" id="bMulti" title="Kai logo ko">📤</button> <button class="s" id="bInv" title="Invite">📲</button> <button class="s" id="bDis" title="Disconnect">🔌</button> <button class="s" id="bSet">⚙️</button></div></div>
  <div id="appr"></div>
  <div id="jrow"><input id="jc" placeholder="Code daalke room me judo"><button id="jb">Judo</button></div>
  <div id="list"></div>
 </aside>
 <main class="gl">
  <div id="empty">💬<br>Left side se kisi ko chuno ya Group kholo.<br><span class="mut">📲 se QR dikhake naye log jodo.</span></div>
  <div id="cv" class="hide">
   <div class="hd"><div style="display:flex;gap:8px;align-items:center"><button class="s" id="back">←</button><div><b id="hn"></b><span class="bdg" id="hs"></span></div></div><span><button class="s hide" id="bKick">🚫 Remove</button> <button class="s" id="bClr">🗑</button></span></div>
   <div id="msgs"></div><div id="xf"></div>
   <div class="cm"><button class="s" id="bAtt">📎</button><input type="file" id="fi" multiple hidden><textarea id="tx" rows="1" placeholder="Message likho…"></textarea><button id="sb">Send</button></div>
  </div>
 </main>
</div>
<div class="ov hide" id="ovInv"><div class="gl"><b>Room me jodo</b><div id="qr" style="background:#fff;padding:10px;border-radius:12px;justify-self:center"></div><input id="lnk" readonly><button id="cpy">🔗 Link copy</button><input id="tok" readonly><button class="s" id="cpy2">🔑 Code copy</button><span class="mut">Sirf unhe do jinhe judne dena hai. Naye banda ko host Allow karega.</span><button class="s" data-x>Band karo</button></div></div>
<div class="ov hide" id="ovSet"><div class="gl"><b>Settings</b><input id="nm" maxlength="20" placeholder="Tumhara naam"><button class="s" id="bNew">Naya room banao</button><button class="s" id="bLeave">Room chhodo (host ban jao)</button><button class="s" id="bWipe">Saara local data delete</button><button class="s" data-x>Band karo</button></div></div>
<div class="ov hide" id="ovMulti"><div class="gl"><b>Kai logo ko ek saath bhejo</b><div id="mlist" style="text-align:left;max-height:200px;overflow:auto"></div><textarea id="mtx" rows="3" placeholder="Message…"></textarea><input type="file" id="mfi" multiple><button id="mSend">Send</button><button class="s" data-x>Band karo</button></div></div>
<div id="toast" class="hide"></div>
<script>
const $=id=>document.getElementById(id),L=localStorage,PFX='qs3-',CH=131072,BIG=8388608,MAXF=8589934592,NS=3;
const lg=(k,v)=>{try{return v===undefined?L.getItem(k):L.setItem(k,v)}catch(e){return null}};
const rnd=(n,al='abcdefghjkmnpqrstuvwxyz23456789')=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>al[b%al.length]).join('');
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const fmt=n=>n<1024?Math.round(n)+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';
const cleanName=s=>String(s||'').replace(/[\u0000-\u001f\u007f<>]/g,'').trim().slice(0,20)||'User';
const cleanFile=s=>String(s||'').replace(/[\u0000-\u001f<>:"\/\\|?*]+/g,'_').replace(/^\.+/,'').slice(0,120)||'file';
const safeMime=t=>/^image\/(png|jpeg|gif|webp)$/.test(t)?t:'application/octet-stream';
const UIDRE=/^[a-z0-9]{12}$/,isU=u=>typeof u==='string'&&UIDRE.test(u);
const te=new TextEncoder(),td=new TextDecoder();
const toast=t=>{const x=$('toast');x.textContent=t;x.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.add('hide'),3000)};
const q=(o,fn,d)=>{o._q=(o._q||Promise.resolve()).then(()=>fn(d)).catch(console.error)};
const toBuf=async d=>d instanceof ArrayBuffer?d:(d.buffer?d.buffer.slice(d.byteOffset,d.byteOffset+d.byteLength):await new Blob([d]).arrayBuffer());
const drain=async c=>{const dc=c.dataChannel;if(dc&&dc.bufferedAmount>BIG){dc.bufferedAmountLowThreshold=BIG/2;await new Promise(r=>{const t=setTimeout(r,10000);dc.onbufferedamountlow=()=>{clearTimeout(t);dc.onbufferedamountlow=null;r()}})}};
const P=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});

/* ---- disk storage (OPFS) so multi-GB files never sit in RAM ---- */
const opfs=async()=>navigator.storage.getDirectory();
const rmFid=async f=>{try{await (await opfs()).removeEntry(f)}catch(e){}};
const wipeOpfs=async()=>{try{const r=await opfs();for await(const [n] of r.entries())await r.removeEntry(n,{recursive:true})}catch(e){}};
const fileOf=async o=>{if(o.blob)return o.blob;if(o.fid){try{return await (await (await opfs()).getFileHandle(o.fid)).getFile()}catch(e){}}return null};
async function mkSink(){
  let w=null,fid=null,root=null;
  try{root=await opfs();fid='f'+rnd(14);const fh=await root.getFileHandle(fid,{create:true});w=await fh.createWritable()}
  catch(e){if(fid&&root)try{await root.removeEntry(fid)}catch(x){}w=null;fid=null}
  const s={fid,mem:w?null:[],items:[],n:0,chain:Promise.resolve(),err:0};
  s.flush=()=>{
    const it=s.items.sort((a,b)=>a.p-b.p);s.items=[];s.n=0;if(!it.length)return;
    s.chain=s.chain.then(async()=>{
      for(let i=0;i<it.length;){
        let j=i,end=it[i].p+it[i].d.byteLength;
        while(j+1<it.length&&it[j+1].p===end){j++;end+=it[j].d.byteLength}
        await w.write({type:'write',position:it[i].p,data:new Blob(it.slice(i,j+1).map(x=>x.d))});i=j+1;
      }
    }).catch(()=>{s.err=1});
  };
  s.add=(idx,d)=>{if(w){s.items.push({p:idx*CH,d});s.n+=d.byteLength;if(s.n>=4194304)s.flush()}else s.mem[idx]=d};
  s.finish=async()=>{if(!w)return new Blob(s.mem);s.flush();await s.chain;if(s.err)throw 0;await w.close()};
  s.abort=async()=>{if(w)try{await w.abort()}catch(e){}if(fid)try{await root.removeEntry(fid)}catch(e){}};
  return s;
}

/* ---- crypto: room secret = entry pass (mutual proof), WebRTC itself is DTLS encrypted ---- */
let KEY;
const b64=u=>{let s='';u.forEach(b=>s+=String.fromCharCode(b));return btoa(s)},unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function mkKey(room,secret){const k=await crypto.subtle.importKey('raw',te.encode(secret),'PBKDF2',false,['deriveKey']);KEY=await crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('qs:'+room),iterations:100000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(s){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,te.encode(s))),o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64(o)}
async function dec(s){const o=unb64(s);return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:o.slice(0,12)},KEY,o.slice(12)))}

/* ---- state + IndexedDB ---- */
let UID=lg('qs_uid');if(!UID){UID=rnd(12);lg('qs_uid',UID)}
let NAME=cleanName(lg('qs_name')||prompt('Tumhara naam?')||'User'+Math.floor(10+Math.random()*90));lg('qs_name',NAME);
let ROOM,SECRET,isHost,peer,conn,db,cur=null,online=new Set(),conns={},routes={},inc={},queue=[],sending=false,urls=[],LEADER=null,HOSTUID=null,pend={},manualOff=false,dcs={},dw={};
const seen=new Set();
const contacts=new Map(),xf=new Map(),GROUP={uid:'group',name:'👥 Group',up:0};
const idb=n=>new Promise((res,rej)=>{const r=indexedDB.open(n,1);r.onupgradeneeded=()=>{r.result.createObjectStore('msgs',{keyPath:'id',autoIncrement:true}).createIndex('chat','chat');r.result.createObjectStore('contacts',{keyPath:'uid'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const saveContact=c=>{const{...o}=c;P(tx('contacts','readwrite').put(o)).catch(()=>{})};
const isOn=u=>u==='group'?false:isHost?!!(conns[u]&&conns[u].ok):online.has(u);
const parseTok=s=>{const m=/(\d{6})-([a-z0-9]{8,})/i.exec(s||'');return m&&{room:m[1],secret:m[2]}};

(async()=>{
  navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
  $('me').textContent=NAME;
  let t=parseTok(location.hash.slice(1));
  if(t){lg('qs_join',t.room+'-'+t.secret);lg('qs_role','guest');history.replaceState(null,'',location.pathname)}
  else if(lg('qs_role')==='guest')t=parseTok(lg('qs_join'));
  isHost=!t;
  if(isHost){t=parseTok(lg('qs_host'));if(!t){t={room:rnd(6,'0123456789'),secret:rnd(10)};lg('qs_host',t.room+'-'+t.secret)}}
  ROOM=t.room;SECRET=t.secret;LEADER=isHost?(lg('qs_leader_'+t.room)||UID):null;
  if(isHost)HOSTUID=UID;
  await mkKey(ROOM,SECRET);db=await idb('qs-'+ROOM);
  for(const c of await P(tx('contacts').getAll()))if(c.uid==='group')Object.assign(GROUP,c);else contacts.set(c.uid,c);
  if(isHost&&LEADER!==UID&&!contacts.has(LEADER))LEADER=UID;renderList();isHost?startHost():startGuest();
  setInterval(()=>{for(const k in inc)if(Date.now()-inc[k].last>120000)abortInc(k);renderXf()},30000);
})();
const setSt=(t,on)=>{$('st').textContent=t;$('st').className='bdg'+(on?' on':'')};
const link=()=>location.origin+location.pathname+'#'+ROOM+'-'+SECRET;

/* ---- DIRECT file channels (guest <-> guest, no relay through host) ---- */
// receiver side: verify the sender knows the room secret and is a known member
function dServe(c){
  const st={n:rnd(16),ok:0,uid:null};
  c.on('open',async()=>{c.send(JSON.stringify({t:'chal',n:st.n,hp:await enc(st.n)}));setTimeout(()=>{if(!st.ok)c.close()},8000)});
  c.on('data',d=>q(st,async x=>{
    if(typeof x==='string'){
      if(x.length>20000)return;
      let m;try{m=JSON.parse(x)}catch(e){return}
      if(!st.ok){
        if(m.t!=='hello'||!isU(m.uid)||m.uid===UID)return c.close();
        try{const p=JSON.parse(await dec(m.proof));if(p.n!==st.n||p.uid!==m.uid)throw 0}catch(e){return c.close()}
        const k=contacts.get(m.uid);if(!k||k.blocked)return c.close();
        st.ok=1;st.uid=m.uid;c.send(JSON.stringify({t:'ok'}));return;
      }
      if(m.t==='meta'&&Number.isInteger(m.tid)&&m.tid>=0&&typeof m.name==='string'&&m.size>=0&&m.size<=MAXF){
        await incoming({t:'meta',tid:m.tid,mid:String(m.mid||'').slice(0,20),ts:Date.now(),from:st.uid,fn:fnOf(st.uid),g:0,name:m.name,size:m.size,type:String(m.type||''),direct:1});
        if(inc[m.tid])c.send(JSON.stringify({t:'rdy',tid:m.tid}));
      }
    }else if(st.ok)onChunk(await toBuf(x),st.uid);
  },d));
  c.on('error',()=>{});
}
// sender side: open one verified stripe to a peer
function dOpen(uid){
  return new Promise((res,rej)=>{
    const c=peer.connect(PFX+ROOM+'-'+uid,{reliable:true,serialization:'raw',metadata:{k:'f'}});
    const to=setTimeout(()=>{try{c.close()}catch(e){}rej(0)},7000);
    c.on('data',d=>q(c,async x=>{
      if(typeof x!=='string')return;let m;try{m=JSON.parse(x)}catch(e){return}
      if(m.t==='chal'){
        try{if(await dec(m.hp)!==m.n)throw 0}catch(e){clearTimeout(to);c.close();return rej(0)}
        c.send(JSON.stringify({t:'hello',uid:UID,proof:await enc(JSON.stringify({n:m.n,uid:UID}))}));
      }else if(m.t==='ok'){clearTimeout(to);res(c)}
      else if(m.t==='rdy'&&dw[m.tid])dw[m.tid]();
    },d));
    c.on('close',()=>{clearTimeout(to);rej(0)});c.on('error',()=>{});
  });
}
function dget(uid){
  const p=dcs[uid];
  if(p)return p.then(a=>a.every(c=>c.open)?a:(delete dcs[uid],dget(uid)),()=>null);
  const np=dcs[uid]=Promise.all(Array.from({length:NS},()=>dOpen(uid)));
  np.catch(()=>{if(dcs[uid]===np)delete dcs[uid]});
  return np.catch(()=>null);
}

/* ---- HOST (hub) ---- */
function startHost(){
  peer=new Peer(PFX+ROOM);
  peer.on('open',()=>setSt('● room live',1));
  peer.on('error',e=>{if(e.type==='unavailable-id'){setSt('room busy, retry…');try{peer.destroy()}catch(x){}if(!manualOff)setTimeout(startHost,4000)}else if(e.type!=='peer-unavailable')setSt('error '+e.type)});
  peer.on('disconnected',()=>{if(!manualOff&&!peer.destroyed)try{peer.reconnect()}catch(e){}});
  peer.on('connection',c=>{
    if(c.metadata&&c.metadata.k==='f'){dServe(c);return}
    if(Object.keys(conns).length>=30){c.close();return}
    const st={c,n:rnd(16),w:0,k:0};
    c.on('open',async()=>{c.send(JSON.stringify({t:'chal',n:st.n,hp:await enc(st.n)}));setTimeout(()=>{if(!st.ver)c.close()},8000)});
    c.on('data',d=>q(st,x=>hostRecv(st,x),d));
    c.on('close',()=>{if(st.uid&&pend[st.uid]===st)delete pend[st.uid];for(const k in routes)if(routes[k].from===st.uid)delete routes[k];if(st.uid&&conns[st.uid]===st){delete conns[st.uid];pushRoster();if(st.uid===LEADER)Object.values(pend).forEach(p=>showReq({t:'jreq',uid:p.uid,name:p.name}))}});
    c.on('error',()=>{});
  });
}
async function hostRecv(st,d){
  const c=st.c;
  if(typeof d==='string'){
    const now=Date.now();if(now-st.w>1000){st.w=now;st.k=0}if(++st.k>60||d.length>20000)return c.close();
    let m;try{m=JSON.parse(d)}catch(e){return}
    if(!st.ver){
      if(m.t!=='hello'||!isU(m.uid)||m.uid===UID)return c.close();
      try{const p=JSON.parse(await dec(m.proof));if(p.n!==st.n||p.uid!==m.uid)throw 0}catch(e){return c.close()}
      const ex=contacts.get(m.uid);if(ex&&ex.blocked)return c.close();
      st.ver=1;st.uid=m.uid;st.name=cleanName(m.name);
      ex?accept(st):askApproval(st);return;
    }
    if(st.ok)route(st.uid,m);
  }else if(st.ok){
    const buf=await toBuf(d);if(buf.byteLength<9)return;
    const r=routes[st.uid+':'+new DataView(buf).getUint32(0)];if(r)await fwd(r,buf);
  }
}
const reqs={},approver=()=>LEADER&&LEADER!==UID&&isOn(LEADER)?LEADER:UID;
function askApproval(st){pend[st.uid]=st;const m={t:'jreq',uid:st.uid,name:st.name},ap=approver();ap===UID?showReq(m):sendTo(ap,m)}
function resolvePending(uid,ok){
  const st=pend[uid];delete pend[uid];if(!st||!st.c.open)return;
  if(ok)accept(st);else{contacts.set(uid,{uid,name:st.name,blocked:1,up:0});saveContact(contacts.get(uid));st.c.close()}
}
function showReq(m){
  const key=m.t+(m.uid||m.from);if(reqs[key])return;
  const row=el('div'),a=el('button',null,'Allow'),b=el('button','s','Deny');
  row.append(el('span',null,m.t==='jreq'?cleanName(m.name)+' judna chahta hai':cleanName(m.fn)+' leader banna chahta hai'),a,b);$('appr').append(row);reqs[key]=row;
  const done=ok=>{row.remove();delete reqs[key];

function pushRoster(){

const fnOf=u=>u===UID?NAME:(contacts.get(u)||{}).name||'?';
const okU=(u,from)=>u!==from&&(u===UID||(contacts.has(u)&&!contacts.get(u).blocked));
const targetsOf=(from,to)=>to==='group'?[...[...contacts.values()].filter(c=>!c.blocked).map(c=>c.uid),UID].filter(u=>u!==from):Array.isArray(to)?[...new Set(to.filter(u=>isU(u)&&okU(u,from)))].slice(0,30):typeof to==='string'&&okU(to,from)?[to]:[];
function sendTo(u,o){if(u===UID)incoming(o);else{const s=conns[u];if(s&&s.ok&&s.c.open)s.c.send(JSON.stringify(o))}}
function route(from,m){
  const g=m.to==='group'?1:0;
  if(m.t==='lreq'){if(from===LEADER)return;const ap=approver();if(ap===from)setLeader(from);else sendTo(ap,{t:'lreq',from,fn:fnOf(from)});return}
  if(m.t==='jdec'){if(from===LEADER&&isU(m.uid))resolvePending(m.uid,!!m.ok);return}
  if(m.t==='lset'){if(from===LEADER&&isU(m.uid)&&okU(m.uid,''))setLeader(m.uid);return}
  if(m.t==='kick'){if(from===LEADER&&isU(m.uid))removeMember(m.uid);return}
  if(m.t==='edit'||m.t==='del'){
    if(typeof m.mid!=='string'||m.mid.length>20||(m.t==='edit'&&(typeof m.d!=='string'||!m.d||m.d.length>8000)))return;
    const o={t:m.t,mid:m.mid,from,g,d:m.d};targetsOf(from,m.to).forEach(u=>sendTo(u,o));return;
  }
  if(m.t==='msg'){
    if(typeof m.d!=='string'||!m.d||m.d.length>8000)return;
    const o={t:'msg',mid:String(m.mid||rnd(10)).slice(0,20),ts:Date.now(),from,fn:fnOf(from),g,d:m.d};
    targetsOf(from,m.to).forEach(u=>sendTo(u,o));
  }else if(m.t==='meta'){
    if(!Number.isInteger(m.tid)||m.tid<0||m.tid>4294967295||typeof m.name!=='string'||!(m.size>=0&&m.size<=MAXF))return;
    const tg=targetsOf(from,m.to).filter(u=>u===UID||(conns[u]&&conns[u].ok));
    routes[from+':'+m.tid]={from,tg};
    const o={t:'meta',tid:m.tid,mid:String(m.mid||'').slice(0,20),ts:Date.now(),from,fn:fnOf(from),g,name:cleanFile(m.name),size:m.size,type:safeMime(String(m.type||''))};
    tg.forEach(u=>sendTo(u,o));
  }else if(m.t==='end'){
    const r=routes[from+':'+m.tid];if(!r)return;
    r.tg.forEach(u=>sendTo(u,{t:'end',tid:m.tid}));delete routes[from+':'+m.tid];
  }
}
async function fwd(r,buf){for(const u of r.tg){if(u===UID)onChunk(buf);else{const s=conns[u];if(s&&s.ok&&s.c.open){await drain(s.c);s.c.send(buf)}}}}

/* ---- GUEST ---- */
let rt;
function retry(){clearTimeout(rt);try{peer.destroy()}catch(e){}if(!manualOff)rt=setTimeout(startGuest,3500)}
function startGuest(){
  setSt('connecting…');
  peer=new Peer(PFX+ROOM+'-'+UID);
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'&&!String(e.message||'').trim().endsWith(PFX+ROOM))return; // a direct peer is offline, not the host
    setSt(e.type==='peer-unavailable'?'host offline':e.type==='unavailable-id'?'purana session band ho raha…':'error '+e.type);retry();
  });
  peer.on('connection',c=>{if(c.metadata&&c.metadata.k==='f')dServe(c);else c.close()});
  peer.on('open',()=>{
    const c=conn=peer.connect(PFX+ROOM,{reliable:true,serialization:'raw'});let ver=false;
    c.on('data',d=>q(c,async x=>{
      if(typeof x==='string'){
        if(x.length>30000)return;
        let m;try{m=JSON.parse(x)}catch(e){return}
        if(m.t==='chal'){
          try{if(await dec(m.hp)!==m.n)throw 0}catch(e){setSt('⚠ galat host');clearTimeout(rt);c.close();return}
          c.send(JSON.stringify({t:'hello',uid:UID,name:NAME,proof:await enc(JSON.stringify({n:m.n,uid:UID}))}));setSt('host approval ka wait…');
        }else if(m.t==='ok'){ver=true;setSt('● connected',1)}
        else if(!ver)return;
        else if(m.t==='roster'&&Array.isArray(m.list))onRoster(m.list,m.leader,m.host);
        else if(['msg','meta','end','edit','del','lreq'].includes(m.t)){if(m.t==='end'||isU(m.from))incoming(m)}
        else if(m.t==='jreq'&&isU(m.uid))incoming(m)
        else if(m.t==='kicked'){manualOff=true;clearTimeout(rt);setSt('Leader ne room se hata diya');$('bDis').textContent='🔌 Connect'}
      }else if(ver)onChunk(await toBuf(x));
    },d));
    c.on('close',()=>{online=new Set();renderList();updateHead();setSt('disconnected');if(c===conn)retry()});
    c.on('error',()=>{});
  });
}
function onRoster(list,leader,host){
  if(isU(leader))LEADER=leader;
  if(isU(host))HOSTUID=host;
  const on=new Set();
  for(const e of list.slice(0,100)){
    if(!isU(e.uid)||e.uid===UID)continue;
    let c=contacts.get(e.uid);if(!c){c={uid:e.uid,up:Date.now()};contacts.set(e.uid,c)}
    c.name=cleanName(e.name);if(e.on){on.add(e.uid);if(!online.has(e.uid))c.up=Date.now()}saveContact(c);
  }
  const ids=new Set(list.map(e=>e.uid));
  for(const u of [...contacts.keys()])if(!ids.has(u)){contacts.delete(u);try{tx('contacts','readwrite').delete(u)}catch(e){}}
  if(cur&&cur!=='group'&&!contacts.has(cur))$('back').onclick();
  online=on;renderList();updateHead();
}

/* ---- receive ---- */
async function incoming(m){
  const chat=m.g?'group':m.from;
  if(m.t==='lreq'||m.t==='jreq'){if(isHost||LEADER===UID)showReq(m);return}
  if(m.t==='edit'||m.t==='del'){await remoteEdit(m,chat);return}
  if(m.t==='msg'){
    if(typeof m.d!=='string'||m.d.length>8000||seen.has(m.mid))return;seen.add(m.mid);
    await saveMsg({chat,mid:m.mid,from:m.from,fn:cleanName(m.fn),k:'t',d:m.d,ts:Number(m.ts)||Date.now(),mine:0});
  }else if(m.t==='meta'){
    if(!Number.isInteger(m.tid)||!(m.size>=0&&m.size<=MAXF)||Object.keys(inc).length>20||inc[m.tid])return;
    const r=inc[m.tid]={m:{...m,name:cleanFile(m.name),type:safeMime(String(m.type||''))},chat,got:0,last:Date.now(),t:Date.now(),direct:!!m.direct};
    xf.set('i'+m.tid,{l:'⬇️ '+r.m.name+(r.direct?' ⚡':''),p:0});renderXf();
    r.sp=mkSink();
    r.sp.then(s=>{if(s.mem&&r.m.size>1.5e9&&inc[m.tid]===r){abortInc(m.tid);toast('Itni badi file ke liye Chrome/Edge use karo')}});
    if(!r.m.size)finalize(m.tid);
  }else if(m.t==='end'){
    const r=inc[m.tid];if(r&&!r.direct){abortInc(m.tid);toast('Transfer adhura raha: '+r.m.name)}
  }
}
function abortInc(tid){
  const r=inc[tid];if(!r)return;delete inc[tid];xf.delete('i'+tid);renderXf();
  if(r.sp)r.sp.then(s=>s.abort()).catch(()=>{});
}
async function finalize(tid){
  const r=inc[tid];if(!r)return;delete inc[tid];
  try{
    const s=await r.sp,blob=await s.finish();
    await saveMsg({chat:r.chat,mid:r.m.mid,from:r.m.from,fn:cleanName(r.m.fn),k:'f',name:r.m.name,size:r.m.size,type:r.m.type,fid:s.fid,blob,ts:Date.now(),mine:0});
    toast('✓ '+r.m.name+' mil gayi');
  }catch(e){toast('File save nahi hui: '+r.m.name);try{(await r.sp).abort()}catch(x){}}
  xf.delete('i'+tid);renderXf();
}
function onChunk(buf,from){
  if(buf.byteLength<9)return;
  const dv=new DataView(buf),tid=dv.getUint32(0),r=inc[tid];if(!r)return;
  if(from?(!r.direct||r.m.from!==from):r.direct)return;
  const idx=dv.getUint32(4),p=new Uint8Array(buf,8);
  r.got+=p.byteLength;
  if(r.got>r.m.size){abortInc(tid);return}
  r.sp.then(s=>s.add(idx,p));
  r.last=Date.now();
  if(r.got===r.m.size){finalize(tid);return}
  if(Date.now()-(r.ui||0)>200){r.ui=Date.now();const x=xf.get('i'+tid);if(x){x.p=r.got/r.m.size;x.sp=r.got/Math.max(.2,(Date.now()-r.t)/1000)}renderXf()}
}
let wl=null;
const wake=on=>{try{if(on&&!wl){wl=1;navigator.wakeLock&&navigator.wakeLock.request('screen').then(x=>{wl=x}).catch(()=>{wl=null})}else if(!on&&wl){if(wl.release)wl.release();wl=null}}catch(e){wl=null}};
const renderXf=()=>{$('xf').textContent=[...xf.values()].map(x=>x.l+' '+Math.round(x.p*100)+'%'+(x.sp?' · '+fmt(x.sp)+'/s':'')).join('  ·  ');wake(xf.size>0)};

/* ---- send ---- */
function emit(m){isHost?route(UID,m):conn&&conn.open?conn.send(JSON.stringify(m)):toast('Connected nahi ho')}
function canSend(){
  if(!isHost&&!(conn&&conn.open))return toast('Connected nahi ho'),false;
  if(cur!=='group'&&!isOn(cur)){toast(fnOf(cur)+' offline hai, abhi bhej nahi sakte');return false}
  return true;
}
async function sendText(){
  const d=$('tx').value.trim();if(!d||!cur||!canSend())return;
  if(d.length>8000)return toast('Message bahut lamba hai');
  const mid=rnd(10);$('tx').value='';
  emit({t:'msg',mid,to:cur,d});await saveMsg({chat:cur,from:UID,k:'t',mid,to:cur,d,ts:Date.now(),mine:1});
}
function addFiles(fs,to){
  to=to||cur;if(!to)return;
  if(!Array.isArray(to)&&!canSend())return;
  for(const f of fs){if(f.size>MAXF){toast(f.name+': 8GB se badi file nahi');continue}queue.push({f,to})}pump();
}
async function pump(){
  if(sending)return;sending=true;
  while(queue.length){
    const {f,to}=queue.shift(),tid=Math.floor(Math.random()*4294967296)>>>0,k='o'+tid,mid=rnd(10),tos=Array.isArray(to)?to.filter(isOn):[to];
    if(to!=='group'&&!tos.length){toast('Offline: '+f.name);continue}
    xf.set(k,{l:'⬆️ '+f.name,p:0});renderXf();
    // 1-to-1 guest->guest: go direct (no host relay), striped over NS channels
    let dc=null;
    if(!isHost&&to!=='group'&&tos.length===1&&tos[0]!==HOSTUID){
      xf.get(k).l='🔗 direct connect… '+f.name;renderXf();
      dc=await dget(tos[0]);
      if(dc){
        try{await new Promise((res,rej)=>{dw[tid]=res;setTimeout(()=>rej(0),8000);dc[0].send(JSON.stringify({t:'meta',tid,mid,name:f.name,size:f.size,type:f.type}))})}catch(e){dc=null}
        delete dw[tid];
      }
      xf.get(k).l='⬆️ '+f.name+(dc?' ⚡':' (host se)');
    }
    let r=null;
    if(!dc){
      emit({t:'meta',tid,mid,to,name:f.name,size:f.size,type:f.type});
      r=isHost?routes[UID+':'+tid]:null;
      if(isHost&&(!r||!r.tg.length)){toast('Koi online nahi');xf.delete(k);renderXf();continue}
    }
    let off=0,last=0,idx=0,bad=0;const t0=Date.now();
    while(off<f.size&&!bad){
      const big=await f.slice(off,off+BIG).arrayBuffer();
      for(let p=0;p<big.byteLength;p+=CH){
        const n=Math.min(CH,big.byteLength-p),u=new Uint8Array(8+n),dv=new DataView(u.buffer);
        dv.setUint32(0,tid);dv.setUint32(4,idx);u.set(new Uint8Array(big,p,n),8);
        if(isHost&&!dc)await fwd(r,u.buffer);
        else{const c=dc?dc[idx%NS]:conn;if(!c||!c.open){bad=1;break}await drain(c);c.send(u)}
        idx++;
      }
      off+=big.byteLength;
      if(Date.now()-last>200){last=Date.now();const x=xf.get(k);x.p=off/f.size;x.sp=off/Math.max(.2,(Date.now()-t0)/1000);renderXf()}
    }
    if(!bad){
      const cs=dc||(isHost?[]:[conn]);
      while(cs.some(c=>c.open&&c.dataChannel&&c.dataChannel.bufferedAmount>0))await new Promise(x=>setTimeout(x,50));
    }
    if(!dc)emit({t:'end',tid,to});
    xf.delete(k);renderXf();
    if(bad){toast('Transfer toot gaya: '+f.name);continue}
    for(const c of tos)await saveMsg({chat:c,from:UID,k:'f',mid,to,name:cleanFile(f.name),size:f.size,type:safeMime(f.type),blob:f.size<=3e7?f:undefined,ts:Date.now(),mine:1});
  }
  sending=false;
}

  await wipeOpfs();try{L.clear()}catch(e){}
  indexedDB.databases?indexedDB.databases().then(a=>Promise.all(a.map(d=>indexedDB.deleteDatabase(d.name)))).then(()=>location.href=location.pathname):location.href=location.pathname}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cur){const c=cur==='group'?GROUP:contacts.get(cur);if(c&&c.unread){c.unread=0;saveContact(c);renderList()}}});

/* ---- edit / delete ---- */
const live=()=>isHost||(conn&&conn.open)||(toast('Connected nahi ho'),false);
const chatsOf=o=>o.to?(o.to==='group'?['group']:Array.isArray(o.to)?o.to:[o.to]):[o.chat];
const findMsg=async(chat,mid,from)=>(await P(tx('msgs').index('chat').getAll(chat))).find(x=>x.mid===mid&&x.from===from);
const putMsg=m=>P(tx('msgs','readwrite').put(m));
async function editMsg(o){
  const d=prompt('Message edit karo',o.d);if(d===null)return;const t=d.trim();
  if(!t||t===o.d||t.length>8000||!live())return;
  emit({t:'edit',mid:o.mid,to:o.to||o.chat,d:t});
  for(const c of chatsOf(o)){const m=await findMsg(c,o.mid,UID);if(m){m.d=t;m.ed=1;await putMsg(m)}}
  openChat(cur);
}
async function delMsg(o){
  if(o.mine&&o.mid&&confirm('Sabke liye delete karein?\n(Cancel = sirf is device se delete ka option)')){
    if(!live())return;
    emit({t:'del',mid:o.mid,to:o.to||o.chat});
    for(const c of chatsOf(o)){const m=await findMsg(c,o.mid,UID);if(m){m.k='x';m.d='';delete m.blob;await putMsg(m)}}
    return openChat(cur);
  }
  if(!confirm('Sirf is device se delete karein?'))return;
  if(o.fid)rmFid(o.fid);
  await P(tx('msgs','readwrite').delete(o.id));openChat(cur);
}
async function remoteEdit(m,chat){
  const x=await findMsg(chat,m.mid,m.from);if(!x)return;
  if(m.t==='edit'&&x.k==='t'){x.d=m.d;x.ed=1}else if(m.t==='del'){if(x.fid){rmFid(x.fid);delete x.fid}x.k='x';x.d='';delete x.blob}else return;
  await putMsg(x);if(cur===chat)openChat(chat);
}

/* ---- connect / disconnect / leader / multi / join ---- */
function disconnect(){
  manualOff=true;clearTimeout(rt);
  try{conn&&conn.close()}catch(e){}try{peer&&peer.destroy()}catch(e){}
  for(const u in conns)delete conns[u];for(const u in dcs)delete dcs[u];online=new Set();pend={};
  setSt('disconnected');$('bDis').textContent='🔌 Connect';renderList();updateHead();
}
function reconnect(){manualOff=false;$('bDis').textContent='🔌';isHost?startHost():startGuest()}
$('bDis').onclick=()=>manualOff?reconnect():disconnect();
addEventListener('pagehide',()=>{try{conn&&conn.close()}catch(e){}try{peer&&peer.destroy()}catch(e){}});
$('bLdr').onclick=()=>{if(!live())return;emit({t:'lreq'});toast('Request leader ko bhej di')};
$('bKick').onclick=()=>{
  if(!cur||cur==='group'||!confirm(fnOf(cur)+' ko room se hatana hai?'))return;
  const u=cur;$('back').onclick();isHost?removeMember(u):live()&&conn.send(JSON.stringify({t:'kick',uid:u}));
};
$('jb').onclick=()=>{const t=parseTok($('jc').value);if(!t)return toast('Code galat hai (jaise 123456-abcdefghij)');lg('qs_join',t.room+'-'+t.secret);lg('qs_role','guest');location.href=location.pathname};
$('cpy2').onclick=()=>navigator.clipboard.writeText(ROOM+'-'+SECRET).then(()=>toast('Code copy ho gaya'));
$('bInv').addEventListener('click',()=>{$('tok').value=ROOM+'-'+SECRET});
$('bMulti').onclick=()=>{
  const l=$('mlist');l.innerHTML='';
  const rows=[...contacts.values()].filter(c=>!c.blocked).sort((a,b)=>isOn(b.uid)-isOn(a.uid));
  if(!rows.length)return toast('Abhi koi contact nahi');
  for(const c of rows){const lb=el('label'),cb=el('input');cb.type='checkbox';cb.value=c.uid;cb.disabled=!isOn(c.uid);lb.append(cb,el('span',null,c.name+(isOn(c.uid)?' 🟢':' (offline)')));l.append(lb)}
  $('ovMulti').classList.remove('hide');
};
$('mSend').onclick=async()=>{
  const ids=[...$('mlist').querySelectorAll('input:checked')].map(x=>x.value),t=$('mtx').value.trim(),fs=[...$('mfi').files];
  if(!ids.length)return toast('Kam se kam ek banda chuno');
  if(!t&&!fs.length||!live())return;
  if(t.length>8000)return toast('Message bahut lamba hai');
  if(t){const mid=rnd(10);emit({t:'msg',mid,to:ids,d:t});for(const c of ids)await saveMsg({chat:c,from:UID,k:'t',mid,to:ids,d:t,ts:Date.now(),mine:1})}
  if(fs.length)addFiles(fs,ids);
  $('mtx').value='';$('mfi').value='';$('ovMulti').classList.add('hide');toast('Bhej diya ✓');
};
</script>
