<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Share</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg1:#0f0c29;--bg2:#302b63;--bg3:#24243e;--glass:rgba(255,255,255,.08);--bd:rgba(255,255,255,.18);--tx:#f2f2ff;--mut:#b4b4d6;--ac:#7c5cff;--ac2:#00d4ff;--ok:#2ee6a6}
@media(prefers-color-scheme:light){:root{--bg1:#e8eaff;--bg2:#d6ccff;--bg3:#c9f0ff;--glass:rgba(255,255,255,.55);--bd:rgba(255,255,255,.8);--tx:#1b1b3a;--mut:#55557a}}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));background-attachment:fixed;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:900px;margin:auto;display:grid;gap:16px}
.glass{background:var(--glass);border:1px solid var(--bd);border-radius:20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:18px;box-shadow:0 8px 32px rgba(0,0,0,.25)}
h1{font-size:1.5rem;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
h1 span.logo{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{font-size:.75rem;padding:5px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--bd);color:var(--mut)}
.badge.on{color:var(--ok);border-color:var(--ok)}
#pair{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media(max-width:560px){#pair{grid-template-columns:1fr;justify-items:center;text-align:center}}
#qr{background:#fff;padding:12px;border-radius:16px;width:184px;height:184px}
#qr img,#qr canvas{display:block}
.code{font-size:2rem;letter-spacing:.3em;font-weight:700;margin:6px 0}
.mut{color:var(--mut);font-size:.9rem}
input,textarea,button{font:inherit;color:var(--tx)}
input,textarea{width:100%;background:var(--glass);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
button{border:0;border-radius:12px;padding:11px 18px;cursor:pointer;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font-weight:600}
button.sec{background:var(--glass);border:1px solid var(--bd);color:var(--tx)}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;margin-top:10px}
#drop{border:2px dashed var(--bd);border-radius:16px;padding:26px;text-align:center;cursor:pointer;color:var(--mut);transition:.2s}
#drop.hot{border-color:var(--ac2);background:var(--glass);color:var(--tx)}
#log{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;margin-top:14px}
.m{max-width:85%;padding:10px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--bd);word-break:break-word;font-size:.95rem}
.m.me{align-self:flex-end;background:linear-gradient(90deg,rgba(124,92,255,.5),rgba(0,212,255,.4))}
.m small{display:block;color:var(--mut);margin-top:4px;font-size:.75rem}
.bar{height:6px;border-radius:9px;background:var(--bd);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.m a{color:var(--ac2);font-weight:600}
.m .cp{background:none;border:0;padding:0 0 0 8px;color:var(--ac2);font-size:.75rem;font-weight:600}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="glass"><h1><span class="logo">⚡ QR Share</span><span id="st" class="badge">connecting…</span></h1></div>

  <div class="glass" id="pair">
    <div id="qr"></div>
    <div>
      <div class="mut">Dusre device se QR scan karo ya code daalo</div>
      <div class="code" id="code">······</div>
      <div class="row" style="margin-top:12px"><input id="join" inputmode="numeric" maxlength="6" placeholder="6-digit code daalo (join karne ke liye)"><button id="jb" class="sec">Join</button></div>
      <div class="row"><button id="cl" class="sec">🔗 Link copy</button></div>
    </div>
  </div>

  <div class="glass hide" id="app">
    <div id="drop">📁 File yahan drop karo ya tap karke chuno (multiple chalegi)<input type="file" id="fi" multiple hidden></div>
    <div id="log"></div>
    <div class="row"><textarea id="tx" rows="2" placeholder="Message ya text likho… (Enter = send, Shift+Enter = new line)"></textarea><button id="sb">Send</button></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const CH=16384, PFX='qrshare-';
let peer,conn,incoming=null,queue=[],sending=false;
const hash=()=>location.hash.replace('#','').trim();
const setSt=(t,on)=>{$('st').textContent=t;$('st').classList.toggle('on',!!on)};
const fmt=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';
const rid=()=>String(Math.floor(100000+Math.random()*900000));

function showQR(id){
  const url=location.origin+location.pathname+'#'+id;
  $('code').textContent=id; $('qr').innerHTML='';
  try{new QRCode($('qr'),{text:url,width:160,height:160,correctLevel:QRCode.CorrectLevel.M})}catch(e){$('qr').textContent='QR error'}
  $('cl').onclick=()=>navigator.clipboard.writeText(url).then(()=>{$('cl').textContent='✓ Copied';setTimeout(()=>$('cl').textContent='🔗 Link copy',1500)});
}

function host(){
  const id=rid(); showQR(id); setSt('waiting for device…');
  peer=new Peer(PFX+id);
  peer.on('error',e=>{if(e.type==='unavailable-id')host();else setSt('error: '+e.type)});
  peer.on('connection',c=>{if(conn&&conn.open){c.close();return}bind(c)});
}
function guest(id){
  $('code').textContent=id; $('qr').innerHTML='<div style="color:#333;font-size:.8rem;padding:60px 8px;text-align:center">Joining…</div>';
  setSt('connecting…');
  peer=new Peer();
  peer.on('open',()=>bind(peer.connect(PFX+id,{reliable:true,serialization:'raw'})));
  peer.on('error',e=>setSt(e.type==='peer-unavailable'?'code galat / host offline':'error: '+e.type));
}

function bind(c){
  conn=c;
  c.on('open',()=>{setSt('● connected',true);$('pair').classList.add('hide');$('app').classList.remove('hide');add('Device connected 🎉',false,true)});
  c.on('close',()=>{setSt('disconnected');add('Connection band ho gaya',false,true);$('sb').disabled=true});
  c.on('data',onData);
  c.on('error',e=>setSt('error'));
}

function send(o){conn.send(JSON.stringify(o))}

function add(html,me,sys){
  const d=document.createElement('div');d.className='m'+(me?' me':'');
  if(sys){d.style.alignSelf='center';d.style.color='var(--mut)'}
  d.innerHTML=html;$('log').appendChild(d);$('log').scrollTop=1e9;return d;
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function textMsg(t,me){
  const d=add(esc(t).replace(/\n/g,'<br>')+'<button class="cp">copy</button>',me);
  d.querySelector('.cp').onclick=e=>{navigator.clipboard.writeText(t);e.target.textContent='✓'};
}

async function onData(d){
  if(typeof d==='string'){
    const m=JSON.parse(d);
    if(m.t==='text')textMsg(m.d,false);
    else if(m.t==='meta'){
      const el=add(`⬇️ <b>${esc(m.name)}</b> (${fmt(m.size)})<div class="bar"><i></i></div><small>receiving…</small>`,false);
      incoming={m,parts:[],got:0,el,t0:Date.now()};
    }else if(m.t==='end'&&incoming){
      const {m:mm,parts,el}=incoming;
      const url=URL.createObjectURL(new Blob(parts,{type:mm.type||'application/octet-stream'}));
      el.querySelector('small').innerHTML=`<a href="${url}" download="${esc(mm.name)}">Download karo</a>`;
      el.querySelector('i').style.width='100%';incoming=null;
    }
  }else if(incoming){
    const buf=d instanceof ArrayBuffer?d:(d.buffer?d.buffer.slice(d.byteOffset,d.byteOffset+d.byteLength):await new Blob([d]).arrayBuffer());
    incoming.parts.push(buf);incoming.got+=buf.byteLength;
    const p=incoming.got/incoming.m.size*100,sp=incoming.got/((Date.now()-incoming.t0)/1000||1);
    incoming.el.querySelector('i').style.width=p+'%';
    incoming.el.querySelector('small').textContent=`${p.toFixed(0)}% · ${fmt(sp)}/s`;
  }
}

function sendText(){
  const t=$('tx').value.trim();if(!t||!conn||!conn.open)return;
  send({t:'text',d:t});textMsg(t,true);$('tx').value='';
}
function addFiles(fs){for(const f of fs)queue.push(f);pump()}
async function pump(){
  if(sending)return;sending=true;
  while(queue.length){
    const f=queue.shift();
    const el=add(`⬆️ <b>${esc(f.name)}</b> (${fmt(f.size)})<div class="bar"><i></i></div><small>sending…</small>`,true);
    send({t:'meta',name:f.name,size:f.size,type:f.type});
    const t0=Date.now();let off=0;
    while(off<f.size){
      const buf=await f.slice(off,off+CH).arrayBuffer();
      while(conn.dataChannel&&conn.dataChannel.bufferedAmount>1048576)await new Promise(r=>setTimeout(r,15));
      conn.send(buf);off+=buf.byteLength;
      el.querySelector('i').style.width=(off/f.size*100)+'%';
      el.querySelector('small').textContent=`${(off/f.size*100).toFixed(0)}% · ${fmt(off/((Date.now()-t0)/1000||1))}/s`;
    }
    send({t:'end'});el.querySelector('small').textContent='✓ sent';
  }
  sending=false;
}

$('sb').onclick=sendText;
$('tx').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}};
$('drop').onclick=()=>$('fi').click();
$('fi').onchange=e=>{addFiles(e.target.files);e.target.value=''};
['dragover','dragenter'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.add('hot')}));
['dragleave','drop'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.remove('hot')}));
$('drop').addEventListener('drop',e=>addFiles(e.dataTransfer.files));
addEventListener('paste',e=>{if(e.clipboardData.files.length&&conn&&conn.open)addFiles(e.clipboardData.files)});
$('jb').onclick=()=>{const v=$('join').value.trim();if(/^\d{6}$/.test(v)){location.hash=v;location.reload()}};

/^\d{6}$/.test(hash())?guest(hash()):host();
</script>
</body>
</html>
